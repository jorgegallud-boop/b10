<!--
  PLANTILLA — no es una charla real, no se enlaza desde el índice.
  Para añadir una charla nueva:
    1. Copiar este archivo como charlas/<slug>.html
    2. Rellenar título, fuente y el esquema
    3. Añadir una entrada en assets/js/charlas.js con el mismo slug

  Criterios del esquema (ver también README.md):
    - Fidelidad total al guion pegado en la conversación: nada inventado ni añadido.
    - Ninguna idea del guion se queda fuera, aunque se resuma de forma breve.
    - Directo al grano: sin apartado "Ideas fundamentales" ni "Objetivo de esta charla".
    - Las citas literales del guion van integradas en la propia frase donde aparecen,
      con la clase "cita-inline" (se resaltan en otro color) y, si hay atribución,
      un <span class="cita-fuente"> justo después entre paréntesis.
    - Si el guion trae bibliografía o recursos complementarios, se recogen en la
      <section class="recursos"> del final (solo si el guion los incluye).
-->
<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[Título de la charla] · Apartado II</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="back" href="../index.html">&larr; Todas las charlas</a>
  </header>

  <main class="charla">
    <h1>[Título de la charla]</h1>
    <p class="meta">📎 <a href="[URL ORIGINAL DE LA CHARLA]" target="_blank" rel="noopener">Ver charla original en recursosformacion.org</a></p>

    <ul class="esquema">
      <li>Idea principal 1. <span class="cita-inline">“Cita literal tal y como aparece en el guion.”</span> <span class="cita-fuente">(San Josemaría)</span>
        <ul>
          <li>Matiz o desarrollo de la idea.</li>
        </ul>
      </li>
      <li>Idea principal 2.</li>
    </ul>

    <!-- Solo si el guion trae bibliografía/recursos; si no, quitar este bloque.
    <section class="recursos">
      <h2>Bibliografía para preparar la clase</h2>
      <ul>
        <li>[...]</li>
      </ul>
    </section>
    -->
  </main>

  <footer class="site-footer">
    <p><a href="../index.html">&larr; Volver al índice</a></p>
  </footer>
</body>
</html>
